# completions-proxy basic configuration.
#
# Format: key = value, one per line. `#` starts a comment.
# Everything here is read at startup; restart the proxy after editing.

# TCP port the proxy listens on.
port = 8899

# Interface to bind. 127.0.0.1 keeps it local-only.
# Use 0.0.0.0 to expose it on the LAN (there is no TLS here — do that knowingly).
host = 127.0.0.1

# Provider used when a request asks for a bare model name (no "provider>" prefix).
default_provider = commandcode

# Model used when a request omits "model" entirely.
default_model = deepseek-v4-pro

# Optional bearer token clients must send as `Authorization: Bearer <token>`.
# Leave empty to accept any (or no) Authorization header.
api_key =

# Upstream request timeout in milliseconds. Two hours accommodates long
# pre-generation delays; pirun can still impose a shorter per-run --timeout.
request_timeout_ms = 7200000

# Log level: silent | error | info | debug
# `debug` prints the routing decision and the upstream body for every request.
log_level = info

# Re-read the routing rules files before every request so edits to
# config/cascaded-inference-routing.rules apply without a restart.
hot_reload_routing = true

# Expose GET /v1/routing, which explains how a model name resolves.
expose_routing_endpoint = true
