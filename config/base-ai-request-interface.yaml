  # StepFun: 1.0 / 0.95 for reasoning and agent scenarios (0.6 for plain chat).
  step-3.7-flash:
    source: stepfun-guidance
    temperature: 1.0
    top_p: 0.95
    max_tokens: 32768
  step-3.5-flash:
    source: stepfun-guidance
    temperature: 1.0
    top_p: 0.95
    max_tokens: 32768

  # NVIDIA: reasoning on -> 0.6 / 0.95; greedy when reasoning is off.
  nemotron-3-ultra:
    source: nvidia-model-card
    temperature: 0.6
    top_p: 0.95
    max_tokens: 32768
    reasoning_effort: medium

  hy3:
    source: tencent-model-card
    temperature: 0.9
    top_p: 1.0
    max_tokens: 32768
    reasoning_effort: high

  # xAI publishes no fixed number, only "start at 0 or below 1 and raise it".
  # 0.3 is this project's choice for agentic coding, not a vendor figure.
  grok-4.5:
    source: inferred-xai-guidance
    temperature: 0.3
    top_p: 1.0
    max_tokens: 32768
    reasoning_effort: medium

  laguna-s-2.1:
    source: poolside-eval-config
    temperature: 1.0
    top_p: 1.0
    max_tokens: 32768

  muse-spark-1.2:
    source: meta-defaults
    temperature: 1.0
    top_p: 1.0
    max_tokens: 32768

  # No published guidance found for these. ox-alpha is a stealth model in no
  # catalogue, but it demonstrably returns reasoning_content, and a small
  # max_tokens leaves the reasoning trace no room to finish — so it gets a
  # budget rather than the global floor. Sampling values stay unpublished.
  greg-1:
    source: unpublished
  ox-alpha:
    source: observed
    max_tokens: 32768
