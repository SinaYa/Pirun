interface_mappings:
  crofai-chat-completions:
    request:
      model: $.variant.provider_model
      messages: $.input.messages
      stream: $.input.stream
      temperature: $.input.temperature
      top_p: $.input.top_p
      max_tokens: $.input.max_tokens
      do_sample: $.input.do_sample
      tool_stream: $.input.tool_stream
      presence_penalty: $.input.presence_penalty
      frequency_penalty: $.input.frequency_penalty
      response_format: $.input.response_format
      reasoning_effort:
        when:
          - if:
              reasoning_effort: none
            omit: true
          - else: $.input.reasoning_effort
      tools: $.input.tools
      tool_choice: $.input.tool_choice
      parallel_tool_calls: $.input.parallel_tool_calls
      stop: $.input.stop
      seed: $.input.seed
      n: $.input.n
    response:
      content: $.choices[0].message.content
      reasoning_content: $.choices[0].message.reasoning_content
      tool_calls: $.choices[0].message.tool_calls
      finish_reason: $.choices[0].finish_reason
      usage: $.usage
      attachments: $.choices[0].message.content
    stream_response:
      content_delta: $.choices[0].delta.content
      reasoning_delta: $.choices[0].delta.reasoning_content
      tool_calls_delta: $.choices[0].delta.tool_calls
      usage: $.usage


  commandcode-chat-completions:
    request:
      model: $.variant.provider_model
      messages: $.input.messages
      stream: $.input.stream
      temperature: $.input.temperature
      top_p: $.input.top_p
      max_tokens: $.input.max_tokens
      presence_penalty: $.input.presence_penalty
      frequency_penalty: $.input.frequency_penalty
      response_format: $.input.response_format
      reasoning_effort:
        when:
          - if:
              reasoning_effort: none
            omit: true
          - else: $.input.reasoning_effort
      tools: $.input.tools
      tool_choice: $.input.tool_choice
      parallel_tool_calls: $.input.parallel_tool_calls
      stop: $.input.stop
    response:
      content: $.choices[0].message.content
      reasoning_content: $.choices[0].message.reasoning_content
      tool_calls: $.choices[0].message.tool_calls
      finish_reason: $.choices[0].finish_reason
      usage: $.usage
      attachments: $.choices[0].message.content
    stream_response:
      content_delta: $.choices[0].delta.content
      reasoning_delta: $.choices[0].delta.reasoning_content
      tool_calls_delta: $.choices[0].delta.tool_calls
      usage: $.usage

  deepseek-chat-completions:
    request:
      model: $.variant.provider_model
      messages: $.input.messages
      stream: $.input.stream
      temperature: $.input.temperature
      top_p: $.input.top_p
      max_tokens: $.input.max_tokens
      presence_penalty: $.input.presence_penalty
      frequency_penalty: $.input.frequency_penalty
      response_format: $.input.response_format
      thinking:
        when:
          - if:
              reasoning_effort: none
            set: { type: disabled }
          - else:
              type: enabled
      reasoning_effort:
        when:
          - if:
              reasoning_effort: [high]
            set: high
          - if:
              reasoning_effort: [xhigh]
            set: max
          - else:
              omit: true
      tools: $.input.tools
      tool_choice: $.input.tool_choice
      parallel_tool_calls: $.input.parallel_tool_calls
      stop: $.input.stop
      seed: $.input.seed
      n: $.input.n
    response:
      content: $.choices[0].message.content
      reasoning_content: $.choices[0].message.reasoning_content
      tool_calls: $.choices[0].message.tool_calls
      finish_reason: $.choices[0].finish_reason
      usage: $.usage
      attachments: $.choices[0].message.content
    stream_response:
      content_delta: $.choices[0].delta.content
      reasoning_delta: $.choices[0].delta.reasoning_content
      tool_calls_delta: $.choices[0].delta.tool_calls
      usage: $.usage
